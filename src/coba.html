  // ============================================================

  const CACHE_KEY = "appointment_form_cache";
  const CACHE_EXPIRY_TIME = 24 * 60 * 60 * 1000; // 24 hours

  // ============================================================
  // CACHE MANAGEMENT
  // ============================================================
  class CacheManager {
    static set(key, data) {
      const cacheData = {
        data,
        timestamp: Date.now(),
      };
      localStorage.setItem(key, JSON.stringify(cacheData));
    }

    static get(key) {
      const cacheData = localStorage.getItem(key);
      if (!cacheData) return null;

      try {
        const parsed = JSON.parse(cacheData);
        const now = Date.now();

        // Check if cache is expired
        if (now - parsed.timestamp > CACHE_EXPIRY_TIME) {
          localStorage.removeItem(key);
          return null;
        }

        return parsed.data;
      } catch (error) {
        console.error("Cache parse error:", error);
        return null;
      }
    }

    static remove(key) {
      localStorage.removeItem(key);
    }

    static clear() {
      localStorage.removeItem(CACHE_KEY);
    }
  }

  // ============================================================
  // STATE MANAGEMENT
  // ============================================================
  const AppState = {
    dtInstance: null,
    transactionUsers: [],
    currentEditId: null,
    formData: {
      users: [],
      devices: [],
      companies: [],
      purposes: [],
      vehicleTypes: [],
      employees: [],
    },

    addUser(userData) {
      const newUser = {
        id: `${Date.now()}-${userData.userId || ""}`,
        ...userData,
      };
      this.transactionUsers.push(newUser);
      this.saveToCache();
      return newUser;
    },

    updateUser(id, userData) {
      this.transactionUsers = this.transactionUsers.map((item) => (item.id === id ? { ...item, ...userData } : item));
      this.saveToCache();
    },

    removeUser(id) {
      this.transactionUsers = this.transactionUsers.filter((item) => item.id !== id);
      this.saveToCache();
    },

    getUser(id) {
      return this.transactionUsers.find((item) => item.id === id);
    },

    saveToCache() {
      CacheManager.set(CACHE_KEY, this.transactionUsers);
    },

    loadFromCache() {
      const cached = CacheManager.get(CACHE_KEY);
      if (cached) {
        this.transactionUsers = cached;
      }
    },

    clearCache() {
      CacheManager.clear();
      this.transactionUsers = [];
      this.currentEditId = null;
    },

    clear() {
      this.dtInstance = null;
      this.transactionUsers = [];
      this.currentEditId = null;
    },
  };

  // ============================================================
  // UTILITY FUNCTIONS
  // ============================================================
  function populateSelect(selectElement, data, labelKey = "name", valueKey = "id") {
    if (!selectElement) return;

    // Clear existing options except the first one
    while (selectElement.options.length > 1) {
      selectElement.remove(1);
    }

    // Add new options
    data.forEach((item) => {
      const option = document.createElement("option");
      option.value = item[valueKey];
      option.textContent = item[labelKey];
      selectElement.appendChild(option);
    });
  }

  // ============================================================
  // DEVICE MANAGEMENT
  // ============================================================
  function createDeviceItem(isFirst = false) {
    return `
    <div class="device-item d-flex align-items-center gap-2 mb-2">
      <select name="electronicDevice[]" class="form-select electronic-device">
        <option value="">Select</option>
      </select>

      <button type="button" class="btn btn-add btn-more-device" data-action="add-device" ${isFirst ? "" : 'style="display: none;"'}>
        <i class="bi bi-plus-circle"></i>
      </button>

      <button type="button" class="btn btn-remove-device ${isFirst ? "d-none" : ""}" data-action="remove-device">
        <i class="bi bi-trash"></i>
      </button>
    </div>
  `;
  }

  function addDevice(userCard) {
    const deviceList = userCard.querySelector(".device-list");
    if (!deviceList) return;

    const deviceItem = document.createElement("div");
    deviceItem.className = "device-item d-flex align-items-center gap-2 mb-2";
    deviceItem.innerHTML = `
    <select name="electronicDevice[]" class="form-select electronic-device">
      <option value="">Select</option>
    </select>

    <button type="button" class="btn btn-add btn-more-device" data-action="add-device" style="display: none;">
      <i class="bi bi-plus-circle"></i>
    </button>

    <button type="button" class="btn btn-remove-device" data-action="remove-device">
      <i class="bi bi-trash"></i>
    </button>
  `;

    deviceList.appendChild(deviceItem);

    // Populate new device select
    const deviceSelects = deviceList.querySelectorAll(".electronic-device");
    if (deviceSelects.length > 0) {
      populateSelect(deviceSelects[deviceSelects.length - 1], AppState.formData.devices, "name", "id");
    }

    updateDeviceButtons(userCard);
  }

  function removeDevice(deviceItem) {
    const userCard = deviceItem.closest(".user-card");
    if (!userCard) return;

    const deviceList = userCard.querySelector(".device-list");
    if (!deviceList) return;

    const deviceItems = deviceList.querySelectorAll(".device-item");

    // Minimum harus ada satu device
    if (deviceItems.length <= 1) {
      Swal.fire("Warning", "Harus ada minimal satu device", "warning");
      return;
    }

    deviceItem.remove();
    updateDeviceButtons(userCard);
  }

  function updateDeviceButtons(userCard) {
    const deviceItems = userCard.querySelectorAll(".device-item");

    deviceItems.forEach((item, index) => {
      const removeButton = item.querySelector('[data-action="remove-device"]');
      const addButton = item.querySelector('[data-action="add-device"]');

      if (!removeButton || !addButton) return;

      // Hanya device terakhir yang punya button add
      if (index === deviceItems.length - 1) {
        addButton.style.display = "block";
      } else {
        addButton.style.display = "none";
      }

      // Semua device bisa dihapus kecuali yang pertama jika jumlahnya > 1
      removeButton.classList.toggle("d-none", deviceItems.length <= 1);
    });
  }

  // ============================================================
  // USER CARD MANAGEMENT
  // ============================================================
  function createUserCard(isOriginal = false) {
    const userCard = document.createElement("div");
    userCard.className = "card user-card mb-3 clone-form-group";

    const deleteButtonHTML = isOriginal
      ? ""
      : `<button type="button" class="btn btn-remove-clone" data-action="remove-user">
        <i class="bi bi-trash"></i>
      </button>`;

    userCard.innerHTML = `
    ${deleteButtonHTML}

    <div class="mb-4">
      <label class="form-label">Name</label>
      <select name="userName[]" class="form-select user-name">
        <option value="">Select</option>
      </select>
    </div>

    <div class="mb-4">
      <label class="form-label">Identity Number</label>
      <select name="identityNumber[]" class="form-select identity-number">
        <option value="">Select</option>
      </select>
    </div>

    <div class="mb-4">
      <label class="form-label">Electronic Device</label>
      <div class="device-list">
        ${createDeviceItem(true)}
      </div>
    </div>
  `;

    return userCard;
  }

  function removeUser(userCard) {
    const userList = userCard.closest(".user-card-list");
    if (!userList) return;

    const userCards = userList.querySelectorAll(".user-card");

    // Cek apakah card yang akan dihapus adalah card original (tanpa delete button)
    const deleteButton = userCard.querySelector(".btn-remove-clone");
    if (!deleteButton) {
      Swal.fire("Warning", "Card pertama tidak bisa dihapus", "warning");
      return;
    }

    // Minimal harus ada satu user
    if (userCards.length <= 1) {
      Swal.fire("Warning", "Harus ada minimal satu user", "warning");
      return;
    }

    userCard.remove();
    updateModalScroll();
  }

  // ============================================================
  // MODAL MANAGEMENT
  // ============================================================
  function updateModalScroll() {
    const modalEl = document.querySelector("#modal-list-visitor");
    if (!modalEl) return;

    const modalBody = modalEl.querySelector(".modal-body");
    if (!modalBody) return;

    const userCards = modalBody.querySelectorAll(".user-card");
    modalBody.classList.toggle("has-overflow", userCards.length > 1);
  }

  function addMoreUserToModal() {
    const modalEl = document.querySelector("#modal-list-visitor");
    const userCardList = modalEl?.querySelector(".user-card-list");

    if (!userCardList) return;

    const cloneUser = createUserCard(false);
    userCardList.appendChild(cloneUser);

    // Populate selects untuk user yang baru di-add
    populateSelect(cloneUser.querySelector(".user-name"), AppState.formData.users, "name", "id");
    populateSelect(cloneUser.querySelector(".identity-number"), AppState.formData.users, "identityNumber", "id");

    const deviceSelect = cloneUser.querySelector(".electronic-device");
    if (deviceSelect) {
      populateSelect(deviceSelect, AppState.formData.devices, "name", "id");
    }

    updateModalScroll();
  }

  function getModalFormData() {
    const modalEl = document.querySelector("#modal-list-visitor");
    if (!modalEl) return [];

    const cards = modalEl.querySelectorAll(".user-card");
    const tempUsersData = [];

    cards.forEach((card) => {
      const userName = card.querySelector(".user-name").value;
      const identityNumber = card.querySelector(".identity-number").value;

      const devices = Array.from(card.querySelectorAll(".electronic-device"))
        .map((select) => select.value)
        .filter((val) => val.trim() !== "");

      if (userName || identityNumber) {
        tempUsersData.push({
          userName,
          identityNumber,
          devices,
        });
      }
    });

    return tempUsersData;
  }

  function resetModalForm() {
    const modalEl = document.querySelector("#modal-list-visitor");
    if (!modalEl) return;

    const form = modalEl.querySelector("#form-modal");
    const userCardList = modalEl.querySelector(".user-card-list");

    if (form) form.reset();

    if (userCardList) {
      userCardList.innerHTML = "";
      const originalCard = createUserCard(true);
      userCardList.appendChild(originalCard);

      // Populate original card
      populateSelect(originalCard.querySelector(".user-name"), AppState.formData.users, "name", "id");
      populateSelect(originalCard.querySelector(".identity-number"), AppState.formData.users, "identityNumber", "id");

      const deviceSelect = originalCard.querySelector(".electronic-device");
      if (deviceSelect) {
        populateSelect(deviceSelect, AppState.formData.devices, "name", "id");
      }
    }

    updateModalScroll();
  }

  // ============================================================
  // TABLE MANAGEMENT
  // ============================================================
  async function loadTableUserList() {
    const wrapper = document.querySelector(".visitor-list-table-wrapper");
    if (!wrapper) return;

    // Clear existing instance
    if (AppState.dtInstance) {
      AppState.dtInstance.destroy();
      AppState.dtInstance = null;
    }

    // If no users
    if (AppState.transactionUsers.length === 0) {
      wrapper.innerHTML = `
      <div class="text-center py-4 text-muted">
        <i class="bi bi-inbox" style="font-size: 2rem;"></i>
        <p class="mt-2">Belum ada data user. Klik "Add User" untuk menambah.</p>
      </div>
    `;
      return;
    }

    // Build table rows
    const rows = AppState.transactionUsers
      .map((group, index) => {
        // Format devices - bisa digabung dengan koma atau per user
        const deviceDisplay = group.users.map((u) => `${u.userName}: ${u.devices.join(", ")}`).join(" | ");

        const userName = group.users.map((u) => u.userName).join(" | ");
        const identityNumber = group.users.map((u) => u.identityNumber).join(" | ");

        return `
        <tr>
          <td>${index + 1}</td>
          <td>${userName || "-"}</td>
          <td>${identityNumber || "-"}</td>
          <td>${deviceDisplay || "-"}</td>
          <td>
            <button type="button" class="btn btn-sm btn-warning" data-edit-id="${group.id}" data-bs-toggle="modal" data-bs-target="#modal-list-visitor">
              <i class="bi bi-pencil"></i> Edit
            </button>
            <button type="button" class="btn btn-sm btn-danger" data-delete-id="${group.id}">
              <i class="bi bi-trash"></i> Delete
            </button>
          </td>
        </tr>
      `;
      })
      .join("");

    wrapper.innerHTML = `
    <table id="tempUser-table" class="table table-hover mb-0">
      <thead>
        <tr>
          <th>No</th>
          <th>Name</th>
          <th>Identity Number</th>
          <th>Electronic Device</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        ${rows}
      </tbody>
    </table>
  `;

    const tableEl = wrapper.querySelector("#tempUser-table");
    if (tableEl) {
      AppState.dtInstance = new DataTable(tableEl, {
        searchable: true,
        fixedHeight: false,
        perPageSelect: [10, 25, 50],
        labels: {
          placeholder: "Search...",
          perPage: " ",
          noRows: "Not found",
          info: "Showing {start}-{end} from {rows} data",
        },
      });
    }

    // Attach event listeners
    attachTableEventListeners();
  }

  function attachTableEventListeners() {
    const wrapper = document.querySelector(".visitor-list-table-wrapper");
    if (!wrapper) return;

    wrapper.addEventListener("click", (e) => {
      const editBtn = e.target.closest("[data-edit-id]");
      const deleteBtn = e.target.closest("[data-delete-id]");

      if (editBtn) {
        e.preventDefault();
        const id = editBtn.dataset.editId;
        editUserData(id);
      }

      if (deleteBtn) {
        e.preventDefault();
        const id = deleteBtn.dataset.deleteId;
        deleteUserData(id);
      }
    });
  }

  // ============================================================
  // EDIT & DELETE OPERATIONS
  // ============================================================
  function editUserData(id) {
    const userData = AppState.getUser(id);
    if (!userData) {
      Swal.fire("Error", "Data user tidak ditemukan", "error");
      return;
    }

    AppState.currentEditId = id;

    // Get modal elements
    const modalEl = document.querySelector("#modal-list-visitor");
    const userCardList = modalEl?.querySelector(".user-card-list");

    if (!userCardList) return;

    // Clear existing cards
    userCardList.innerHTML = "";

    // Recreate cards dengan data yang ada
    userData.users.forEach((user, userIndex) => {
      const userCard = createUserCard(userIndex === 0);
      userCardList.appendChild(userCard);

      // Set values
      const nameSelect = userCard.querySelector(".user-name");
      const idSelect = userCard.querySelector(".identity-number");

      populateSelect(nameSelect, AppState.formData.users, "name", "id");
      if (nameSelect) nameSelect.value = user.userName;

      populateSelect(idSelect, AppState.formData.users, "identityNumber", "id");
      if (idSelect) idSelect.value = user.identityNumber;

      // Set devices
      const deviceList = userCard.querySelector(".device-list");
      deviceList.innerHTML = "";

      user.devices.forEach((device, deviceIndex) => {
        const deviceItem = document.createElement("div");
        deviceItem.className = "device-item d-flex align-items-center gap-2 mb-2";
        deviceItem.innerHTML = `
        <select name="electronicDevice[]" class="form-select electronic-device">
          <option value="">Select</option>
        </select>

        <button type="button" class="btn btn-add btn-more-device" data-action="add-device" ${deviceIndex === user.devices.length - 1 ? "" : 'style="display: none;"'}>
          <i class="bi bi-plus-circle"></i>
        </button>

        <button type="button" class="btn btn-remove-device ${user.devices.length <= 1 ? "d-none" : ""}" data-action="remove-device">
          <i class="bi bi-trash"></i>
        </button>
      `;
        deviceList.appendChild(deviceItem);

        // Set device value
        const deviceSelect = deviceItem.querySelector(".electronic-device");
        populateSelect(deviceSelect, AppState.formData.devices, "name", "id");
        deviceSelect.value = device;
      });

      updateDeviceButtons(userCard);
    });

    updateModalScroll();
  }

  function deleteUserData(id) {
    Swal.fire({
      title: "Delete Confirmation",
      text: "Apakah Anda yakin ingin menghapus data user ini?",
      icon: "warning",
      showCancelButton: true,
      confirmButtonColor: "#3085d6",
      cancelButtonColor: "#d33",
      confirmButtonText: "Ya, hapus!",
      cancelButtonText: "Batal",
    }).then((result) => {
      if (result.isConfirmed) {
        AppState.removeUser(id);
        loadTableUserList();
        Swal.fire("Terhapus!", "Data user telah dihapus.", "success");
      }
    });
  }

  // ============================================================
  // FORM EVENT HANDLERS
  // ============================================================
  function setupFormEventHandlers(formModal) {
    if (!formModal) return;

    // Add User Button
    const btnClone = formModal.querySelector("#btn-clone-add-user");
    if (btnClone) {
      btnClone.addEventListener("click", (e) => {
        e.preventDefault();
        addMoreUserToModal();
      });
    }

    // Device dan User management dalam modal
    formModal.addEventListener("click", (event) => {
      const actionButton = event.target.closest("[data-action]");
      if (!actionButton) return;

      const action = actionButton.dataset.action;
      const userCard = actionButton.closest(".user-card");

      if (action === "add-device") {
        event.preventDefault();
        if (userCard) addDevice(userCard);
      }

      if (action === "remove-device") {
        event.preventDefault();
        const deviceItem = actionButton.closest(".device-item");
        if (deviceItem) removeDevice(deviceItem);
      }

      if (action === "remove-user") {
        event.preventDefault();
        if (userCard) removeUser(userCard);
      }
    });

    // Form Submit (Save button pada modal)
    const submitBtn = document.querySelector("#add-user");
    if (submitBtn) {
      submitBtn.addEventListener("click", (e) => {
        e.preventDefault();

        const tempUsersData = getModalFormData();

        if (tempUsersData.length === 0) {
          Swal.fire("Warning", "Harap tambahkan minimal satu user", "warning");
          return;
        }

        // Validate semua field terisi
        const allFilled = tempUsersData.every((u) => u.userName && u.identityNumber && u.devices.length > 0);

        if (!allFilled) {
          Swal.fire("Warning", "Harap isi semua field (Nama, Identity Number, dan Device)", "warning");
          return;
        }

        if (AppState.currentEditId) {
          AppState.updateUser(AppState.currentEditId, { users: tempUsersData });
          AppState.currentEditId = null;
          Swal.fire("Berhasil", "Data user berhasil diperbarui", "success");
        } else {
          AppState.addUser({ users: tempUsersData });
          Swal.fire("Berhasil", "Data user berhasil ditambahkan", "success");
        }

        resetModalForm();

        // Close modal
        const modalEl = document.querySelector("#modal-list-visitor");
        const modalInstance = bootstrap.Modal.getInstance(modalEl);
        if (modalInstance) {
          modalInstance.hide();
        } else {
          const modal = new bootstrap.Modal(modalEl);
          modal.hide();
        }

        loadTableUserList();
      });
    }
  }

  // ============================================================
  // MAIN FORM SUBMISSION
  // ============================================================
  function setupMainFormHandler(mainForm) {
    if (!mainForm) return;

    mainForm.addEventListener("submit", (e) => {
      e.preventDefault();

      if (AppState.transactionUsers.length === 0) {
        Swal.fire("Warning", "Harap tambahkan data user terlebih dahulu", "warning");
        return;
      }

      // Collect form data
      const formData = new FormData(mainForm);
      const data = {
        users: AppState.transactionUsers,
        appointment: Object.fromEntries(formData),
      };

      console.log("Form submitted with data:", data);

      // TODO: Send to backend
      // submitToBackend(data);

      Swal.fire("Berhasil", "Jadwal kunjungan berhasil dibuat", "success").then(() => {
        // Clear cache dan reset everything
        AppState.clearCache();
        AppState.clear();
        mainForm.reset();
        loadTableUserList();
      });
    });
  }

  // ============================================================
  // LOAD FORM DATA FROM API
  // ============================================================
  async function loadFormDataFromAPI() {
    try {
      // Load semua data secara parallel
      const [users, devices, companies, purposes, vehicleTypes, employees] = await Promise.all([
        FormDataService.fetchUsers(),
        FormDataService.fetchElectronicDevices(),
        FormDataService.fetchCompanies(),
        FormDataService.fetchPurposes(),
        FormDataService.fetchVehicleTypes(),
        FormDataService.fetchEmployees(),
      ]);

      AppState.formData = {
        users: users || [],
        devices: devices || [],
        companies: companies || [],
        purposes: purposes || [],
        vehicleTypes: vehicleTypes || [],
        employees: employees || [],
      };

      // Populate select elements
      populateFormSelects();
    } catch (error) {
      console.error("Error loading form data:", error);
      Swal.fire("Warning", "Gagal memuat data form. Silakan refresh halaman.", "warning");
    }
  }

  function populateFormSelects() {
    // Populate modal selects untuk user pertama
    const modalEl = document.querySelector("#modal-list-visitor");
    if (modalEl) {
      const firstUserCard = modalEl.querySelector(".user-card");
      if (firstUserCard) {
        populateSelect(firstUserCard.querySelector(".user-name"), AppState.formData.users, "name", "id");
        populateSelect(firstUserCard.querySelector(".identity-number"), AppState.formData.users, "identityNumber", "id");

        const deviceSelect = firstUserCard.querySelector(".electronic-device");
        if (deviceSelect) {
          populateSelect(deviceSelect, AppState.formData.devices, "name", "id");
        }
      }
    }

    // Populate main form selects
    const formSelects = {
      "#company-origin": AppState.formData.companies,
      "#purpose": AppState.formData.purposes,
      "#vehicle-type": AppState.formData.vehicleTypes,
      "#employee-target": AppState.formData.employees,
    };

    Object.entries(formSelects).forEach(([selector, data]) => {
      const element = document.querySelector(selector);
      if (element) {
        populateSelect(element, data, "name", "id");
      }
    });
  }
