<div class="page-title d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
  <div>
    <h1 class="text-primary mb-3">Detail Information</h1>
  </div>
  <div>
    <p class="text-dark fw-semibold">Download this QR for easier registration</p>
  </div>
</div>

<div class="card p-4">
  <div class="title-container">
    <h5 class="page-title">Detail Appointment</h5>
    <span class="qr-info"><i class="bi bi-info-circle"></i>Show this QR Code to Security personnel</span>
  </div>
  <div>
    <div class="row">
      <div class="col-6">
        <div class="info-container card p-4">
          <h5>Visitor Information</h5>
          <div class="info-item">
            <i class="bi bi-info-circle"></i>
            <span class="info-label">Name</span>
            <span class="info-value" id="info-name"></span>
          </div>
          <div class="info-item">
            <i class="bi bi-info-circle"></i>
            <span class="info-label">Appointment Type</span>
            <span class="info-value" id="info-appointment-type"></span>
          </div>
          <div class="info-item">
            <i class="bi bi-info-circle"></i>
            <span class="info-label">Date Appointment</span>
            <span class="info-value" id="info-appointment-date"></span>
          </div>
          <div class="info-item">
            <i class="bi bi-info-circle"></i>
            <span class="info-label">Purpose</span>
            <span class="info-value" id="info-purpose"></span>
          </div>
          <div class="info-item">
            <i class="bi bi-info-circle"></i>
            <span class="info-label">Host Name</span>
            <span class="info-value" id="info-host"></span>
          </div>
          <div class="info-item">
            <i class="bi bi-info-circle"></i>
            <span class="info-label">Plat Number</span>
            <span class="info-value" id="info-plat-number"></span>
          </div>
        </div>
      </div>
      <div class="col-6">
        <div class="qr-container card p-4">
          <div class="item-qr">
            <img src="" alt="" />
            <i class="bi bi-qr-code-scan"></i>
          </div>
          <div class="btn-wrapper">
            <button class="btn btn-primary" id="download"><i class="bi bi-download"></i> Download Image</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  import Swal from "sweetalert2";
  import { DashboardLayout } from "../layouts/DashboardLayout";
  import { Grid, h } from "gridjs";
  import { fetchAppointmentData, fetchDetailData } from "../services/history";
  import "gridjs/dist/theme/mermaid.css";
  import "../assets/css/history.css";

  let gridInstance = null;

  function handleViewQrCode(id) {
    if (!id) {
      Swal.fire("Error", "Visit code not found", "error");
      return;
    }

    // Navigate to detail page
    window.location.href = `/qrData.json?id=${id}`;
  }

  async function loadTable(container) {
    const wrapper = container.querySelector(".table-container");
    if (!wrapper) return;

    // Show loading state
    wrapper.innerHTML = `
    <div class="text-center py-4 text-muted">
      <div class="spinner-border spinner-border-sm me-2"></div>
      Load data...
    </div>
  `;

    try {
      let history = await fetchAppointmentData();

      console.log("Raw data:", history);

      if (history && !Array.isArray(history)) {
        history = [history];
      }

      // Clear previous instance
      if (gridInstance) {
        gridInstance.destroy();
        gridInstance = null;
      }

      // Handle empty data
      if (!history || history.length === 0) {
        wrapper.innerHTML = `
        <div class="text-center py-4 text-muted">
          No data available
        </div>
      `;
        return;
      }

      // Clear wrapper for fresh start
      wrapper.innerHTML = `<div id="gridjs-container"></div>`;

      const gridContainer = wrapper.querySelector("#gridjs-container");
      gridInstance = new Grid({
        data: history.map((h, i) => ({
          no: i + 1,
          visit_code: h.visit_code,
          visitor_name: h.visitor_name,
          company_name: h.company_name,
          plan_checkin: h.plan_checkin,
          plan_checkout: h.plan_checkout || "-",
          purpose: h.purpose,
          host_name: h.host_name,
          status: h.status,
          action: h.visit_code,
        })),
        columns: [
          {
            name: "No",
            id: "no",
          },
          {
            name: "ID Appointment",
            id: "visit_code",
          },
          {
            name: "Name",
            id: "visitor_name",
          },
          {
            name: "Company",
            id: "company_name",
          },
          {
            name: "Plan Checkin",
            id: "plan_checkin",
          },
          {
            name: "Plan Checkout",
            id: "plan_checkout",
          },
          {
            name: "Purpose",
            id: "purpose",
          },
          {
            name: "Employee Target",
            id: "host_name",
          },
          {
            name: "Status",
            id: "status",
          },
          {
            name: "Action",
            id: "action",
            formatter: (cell, row) => {
              // cell berisi visit_code dari kolom action
              return h(
                "button",
                {
                  type: "button",
                  className: "btn btn-sm btn-outline-info btn-detail",
                  onClick: () => handleViewQrCode(cell),
                },
                "View QR Code",
              );
            },
          },
        ],
        search: true,
        sort: true,
        pagination: { limit: 10 },
        language: {
          search: { placeholder: "Search..." },
          pagination: { message: "Showing page {start} of {end}" },
          noRecordsFound: "No appointments found",
        },
        className: {
          table: "table table-hover mb-0",
          container: "gridjs-container",
        },
      }).render(gridContainer);
    } catch (e) {
      console.error("Error loading appointment data:", e);
      wrapper.innerHTML = `
      <div class="alert alert-danger" role="alert">
        Failed to load appointment data. Please try again.
      </div>
    `;
    }
  }

  const page = document.createElement("div");

  // CONTENT HISTORY
  function historyContent() {
    page.innerHTML = `
    <div class="page-title d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
        <div>
            <h1 class="text-primary mb-3">Appointment History</h1>
        </div>
        <div>
            <div class="count-group">
                <p class="fw-semibold text-dark appointment-count">Total Schedule History</p>
                <p class="badge badge-primary text-light fw-bold" id="totalAppointment">70</p>
                <p class="text-muted fw-semibold">Schedule</p>
            </div>
        </div>
    </div>

    <div class="card p-4">
        <div class="table-container"></div>
    </div>
  `;
    setTimeout(() => {
      loadTable(page);
    }, 0);
    return page;
  }

  async function downloadQrContent(id) {
    try {
      const response = await fetchDetailData(id);

      // Validasi response
      if (!response || !response.res) {
        throw new Error("Failed to fetch detail data");
      }

      const detailData = response.res;
      // let data = Array.isArray(detailData) ? detailData[0] : detailData;
      console.log("datanya", detailData);

      page.innerHTML = `
    <div class="page-title d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
      <div>
        <h1 class="text-primary mb-3">Detail Information</h1>
      </div>
      <div>
        <p class="text-dark fw-semibold">Download this QR for easier registration</p>
      </div>
    </div>

    <div class="card p-4">
      <div class="title-container">
        <h5 class="page-title">Detail Appointment</h5>
        <span class="qr-info"><i class="bi bi-info-circle"></i>Show this QR Code to Security personnel</span>
      </div>
      <div>
        <div class="row">
          <div class="col-6">
            <div class="info-container card p-4">
              <h5>Visitor Information</h5>
              <div class="info-item">
                <i class="bi bi-info-circle"></i>
                <span class="info-label">Name</span>
                <span class="info-value" id="info-name">${detailData.visitor_name || "-"}</span>
              </div>
              <div class="info-item">
                <i class="bi bi-info-circle"></i>
                <span class="info-label">Appointment Type</span>
                <span class="info-value" id="info-appointment-type">${detailData.appointment_type || "-"}</span>
              </div>
              <div class="info-item">
                <i class="bi bi-info-circle"></i>
                <span class="info-label">Date Appointment</span>
                <span class="info-value" id="info-appointment-date">${detailData.plan_checkin || "-"}</span>
              </div>
              <div class="info-item">
                <i class="bi bi-info-circle"></i>
                <span class="info-label">Purpose</span>
                <span class="info-value" id="info-purpose">${detailData.purpose || "-"}</span>
              </div>
              <div class="info-item">
                <i class="bi bi-info-circle"></i>
                <span class="info-label">Host Name</span>
                <span class="info-value" id="info-host">${detailData.host_name || "-"}</span>
              </div>
              <div class="info-item">
                <i class="bi bi-info-circle"></i>
                <span class="info-label">Plat Number</span>
                <span class="info-value" id="info-plat-number">${detailData.plat_number || "-"}</span>
              </div>
            </div>
          </div>
          <div class="col-6">
            <div class="qr-container card p-4">
              <div class="item-qr">
                <img src="${detailData.qr_code || ""}" alt="QR Code" />
                <i class="bi bi-qr-code-scan"></i>
              </div>
              <div class="btn-wrapper">
                <button class="btn btn-primary" id="download"><i class="bi bi-download"></i> Download Image</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    `;

      // Add download button event listener
      const downloadBtn = page.querySelector("#download");
      if (downloadBtn) {
        downloadBtn.addEventListener("click", () => downloadQrCode(detailData.qr_code));
      }
    } catch (e) {
      console.error("Error loading detail data:", e);
      page.innerHTML = `
      <div class="alert alert-danger" role="alert">
        Failed to load detail information. Please try again.
      </div>
    `;
    }
  }

  // Helper function untuk download QR Code
  function downloadQrCode(qrUrl) {
    if (!qrUrl) {
      Swal.fire("Error", "QR Code not found", "error");
      return;
    }

    const link = document.createElement("a");
    link.href = qrUrl;
    link.download = `qr-code-${Date.now()}.png`;
    link.click();
  }

  export function HistoryPage() {
    return DashboardLayout(historyContent);
  }
</script>
